name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint
        run: ruff check *.py deploy handlers tests

      - name: Check formatting
        run: ruff format --check *.py deploy handlers tests

      - name: Run tests
        run: pytest

      - name: Compile application
        run: python -m py_compile *.py deploy/*.py handlers/*.py
