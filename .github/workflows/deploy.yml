name: Deploy Bot

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - "deploy/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tg-poll-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify release
        run: |
          ruff check *.py deploy handlers tests
          ruff format --check *.py deploy handlers tests
          pytest
          python -m py_compile *.py deploy/*.py handlers/*.py

      - name: Build release archive
        run: |
          tar -czf "release-${GITHUB_SHA}.tar.gz" \
            announcements.py bot.py bot_service.py main.py config.py health.py \
            messages.py models.py poll_service.py schedule_commands.py scheduling.py \
            storage.py votes.py handlers deploy requirements.txt

      - name: Upload release archive
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "release-${{ github.sha }}.tar.gz"
          target: /opt/bot_tg/incoming

      - name: Install and verify release
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            archive="/opt/bot_tg/incoming/release-${{ github.sha }}.tar.gz"
            installer="/tmp/tg-poll-bot-install-${{ github.sha }}.sh"
            tar -xOzf "$archive" deploy/install_release.sh > "$installer"
            chmod 0700 "$installer"
            "$installer" "$archive" "${{ github.sha }}" /opt/bot_tg
            rm -f "$installer" "$archive"
            echo "Bot ${{ github.sha }} deployed at $(date)"
