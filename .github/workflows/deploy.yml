name: Deploy Bot

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tg-poll-bot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify release
        run: |
          ruff check *.py deploy tests
          ruff format --check *.py deploy tests
          pytest
          python -m py_compile *.py deploy/*.py

      - name: Upload bot files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "announcements.py,bot.py,config.py,health.py,messages.py,models.py,poll_service.py,scheduling.py,storage.py,votes.py,deploy/check_bot_health.py,requirements.txt"
          target: /opt/bot_tg

      - name: Restart bot on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bot_tg

            venv/bin/pip install -q -r requirements.txt
            venv/bin/python -m py_compile *.py

            export BOT_HEALTH_FILE=/opt/bot_tg/health.json
            export BOT_HEALTH_NOT_BEFORE="$(date -u +%Y-%m-%dT%H:%M:%S%z)"
            systemctl restart tg-poll-bot
            systemctl is-active tg-poll-bot
            for attempt in $(seq 1 15); do
              if venv/bin/python deploy/check_bot_health.py; then
                break
              fi
              if [ "$attempt" -eq 15 ]; then
                echo "Bot health-check failed" >&2
                exit 1
              fi
              sleep 1
            done
            echo "Bot deployed at $(date)"
