name: Deploy Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tg-poll-bot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile bot.py && echo "Syntax OK"

      - name: Upload bot files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "bot.py,requirements.txt"
          target: /opt/bot_tg

      - name: Restart bot on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bot_tg

            venv/bin/pip install -q -r requirements.txt
            python3 -m py_compile bot.py

            systemctl restart tg-poll-bot
            systemctl is-active tg-poll-bot
            echo "Bot deployed at $(date)"
