name: Deploy Bot

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - "deploy/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tg-poll-bot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify bot
        run: |
          ruff check *.py deploy handlers tests
          ruff format --check *.py deploy handlers tests
          pytest --cov=models --cov=storage --cov=votes --cov-report=term --cov-fail-under=80
          python -m py_compile *.py deploy/*.py handlers/*.py

      - name: Upload bot files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "announcements.py,bot.py,main.py,config.py,health.py,models.py,schedule_commands.py,scheduling.py,storage.py,votes.py,handlers,deploy/check_bot_health.py,requirements.txt"
          target: /opt/bot_tg

      - name: Restart and verify bot
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bot_tg
            venv/bin/pip install -q -r requirements.txt
            venv/bin/python -m py_compile *.py handlers/*.py deploy/*.py
            export BOT_HEALTH_FILE=/opt/bot_tg/health.json
            export BOT_HEALTH_NOT_BEFORE="$(date -u +%Y-%m-%dT%H:%M:%S%z)"
            systemctl restart tg-poll-bot
            systemctl is-active --quiet tg-poll-bot
            for attempt in $(seq 1 30); do
              if venv/bin/python deploy/check_bot_health.py; then
                echo "Bot ${{ github.sha }} deployed at $(date)"
                exit 0
              fi
              sleep 1
            done
            journalctl -u tg-poll-bot -n 100 --no-pager
            exit 1
